name: Analytics spec-vs-code drift check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  event-name-drift:
    name: Compare analytics event names in spec vs code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run automated event-name drift check
        run: node scripts/check-analytics-spec-drift.mjs